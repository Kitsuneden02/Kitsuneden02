    </text>
    <text x="26" y="64" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
      Multipath &amp; dead-zone filtering
    </text>
    <text x="16" y="88" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">
      • SE(3) Scan Registration
    </text>
    <text x="26" y="104" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
      Open3D / PointCloud2 pipeline
    </text>
    <text x="16" y="128" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">
      • Real-Time 3D Mesh / Map
    </text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="755" y1="133" x2="783" y2="133" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Stage 4: Field Validation Metrics -->
  <g transform="translate(790, 60)">
    <rect width="182" height="146" rx="8" fill="#0f292a" stroke="#2dd4bf" stroke-width="1.2" />
    <text x="14" y="24" fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">
      04. FIELD RESULTS
    </text>
    <text x="14" y="54" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">
      20x
    </text>
    <text x="62" y="53" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">
      Profiling density
    </text>
    <line x1="14" y1="68" x2="168" y2="68" stroke="#1e3a3a" stroke-width="1" />
    <text x="14" y="94" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">
      2 Anomalies
    </text>
    <text x="14" y="110" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
      Detected in hydro tunnel
    </text>
    <line x1="14" y1="120" x2="168" y2="120" stroke="#1e3a3a" stroke-width="1" />
    <text x="14" y="138" fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600">
      Grade: 7.0 / 7.0 (Max)
    </text>
  </g>
</svg>
