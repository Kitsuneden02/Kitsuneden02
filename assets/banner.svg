<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="55%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#132038" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <radialGradient id="sonarGlow" cx="82%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#2dd4bf" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <pattern id="techGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.65" />
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="998" height="248" x="1" y="1" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  <rect width="998" height="248" x="1" y="1" rx="14" fill="url(#techGrid)" />
  <rect width="998" height="248" x="1" y="1" rx="14" fill="url(#sonarGlow)" />

  <!-- Top Accent Line -->
  <path d="M 15 1.5 L 380 1.5" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Right Side: Polar Sonar / LiDAR & Factor Graph Geometry -->
  <g transform="translate(830, 125)" opacity="0.85">
    <!-- Concentric Range Rings -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="0" cy="0" r="85" fill="none" stroke="#1e3a5f" stroke-width="1" />
    <circle cx="0" cy="0" r="125" fill="none" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="6 4" />
    <circle cx="0" cy="0" r="165" fill="none" stroke="#1e3a5f" stroke-width="0.8" />

    <!-- Sonar Sector Sweep -->
    <path d="M 0 0 L -115 -78 A 140 140 0 0 1 -115 78 Z" fill="#38bdf8" fill-opacity="0.05" />
    <line x1="0" y1="0" x2="-115" y2="-78" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <line x1="0" y1="0" x2="-115" y2="78" stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.4" />
    <line x1="-180" y1="0" x2="140" y2="0" stroke="#1e293b" stroke-width="0.9" />
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#1e293b" stroke-width="0.9" />

    <!-- Trajectory & Pose Graph Edges -->
    <polyline points="-135,42 -92,18 -48,-12 0,0 44,-28 88,-15" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.7" />
    <polyline points="-92,18 -65,-45 -48,-12" fill="none" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.6" />
    <polyline points="-48,-12 -18,48 0,0" fill="none" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.6" />
    <polyline points="0,0 25,-62 44,-28" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.6" />

    <!-- Point Cloud / Landmark Nodes -->
    <circle cx="-135" cy="42" r="3.5" fill="#38bdf8" />
    <circle cx="-92" cy="18" r="4" fill="#38bdf8" />
    <circle cx="-65" cy="-45" r="2.5" fill="#2dd4bf" />
    <circle cx="-48" cy="-12" r="4" fill="#38bdf8" />
    <circle cx="-18" cy="48" r="2.5" fill="#2dd4bf" />
    <circle cx="0" cy="0" r="5" fill="#f8fafc" stroke="#38bdf8" stroke-width="2" />
    <circle cx="25" cy="-62" r="2.5" fill="#818cf8" />
    <circle cx="44" cy="-28" r="4" fill="#38bdf8" />
    <circle cx="88" cy="-15" r="3.5" fill="#2dd4bf" />

    <!-- Sparse 3D Point Cloud Arc Dots -->
    <circle cx="-118" cy="-32" r="1.5" fill="#38bdf8" opacity="0.7" />
    <circle cx="-122" cy="-18" r="1.8" fill="#2dd4bf" opacity="0.8" />
    <circle cx="-125" cy="-4" r="1.5" fill="#38bdf8" opacity="0.6" />
    <circle cx="-123" cy="11" r="2" fill="#2dd4bf" opacity="0.9" />
    <circle cx="-119" cy="25" r="1.5" fill="#38bdf8" opacity="0.7" />
    <circle cx="-110" cy="-50" r="1.5" fill="#2dd4bf" opacity="0.5" />

    <!-- Coordinate HUD Label -->
    <text x="-155" y="98" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1">
      SE(3) STATE ESTIMATION // POINTCLOUD2
    </text>
  </g>

  <!-- Left Content Block -->
  <g transform="translate(48, 0)">
    <!-- Domain Tag -->
    <rect x="0" y="34" width="490" height="24" rx="5" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="46" r="3.5" fill="#2dd4bf" />
    <text x="26" y="50" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.2">
      ROBOTICS · SENSOR FUSION · 3D PERCEPTION · SOFTWARE
    </text>

    <!-- Main Name -->
    <text x="0" y="104" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.5">
      Sebastián Herrera Torres
    </text>

    <!-- Japanese Subtitle -->
    <text x="2" y="134" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" font-size="14" font-weight="500" letter-spacing="0.5">
      こんにちは！チリ出身のロボティクス・ソフトウェアエンジニア、セバスティアン・エレラです。
    </text>

    <!-- Role & Credentials -->
    <text x="2" y="166" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
      Electrical Engineer (U. de Chile, Highest Honors) · Software Engineer I @ Grupo Lagos
    </text>

    <!-- Bottom Tech Pills -->
    <g transform="translate(0, 190)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#94a3b8">
      <rect x="0" y="0" width="96" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="16" fill="#e2e8f0">ROS 2 Jazzy</text>

      <rect x="106" y="0" width="134" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="118" y="16" fill="#e2e8f0">EKF / UKF Fusion</text>

      <rect x="250" y="0" width="142" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="262" y="16" fill="#e2e8f0">3D Point Clouds</text>

      <rect x="402" y="0" width="128" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="414" y="16" fill="#e2e8f0">Python · C++</text>

      <rect x="540" y="0" width="132" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="552" y="16" fill="#38bdf8">Santiago, Chile</text>
    </g>
  </g>
</svg>
